spring:
  application:
    name: spring-batch-processor
  datasource:
    url: jdbc:postgresql://localhost:5432/statedb
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: always

azure:
  openai:
    endpoint: ${AZURE_OPENAI_ENDPOINT}
    api-key: ${AZURE_OPENAI_API_KEY}
    deployment-name: gpt-4

batch:
  chunk-size: 500
  thread-pool-size: 10

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,batch

logging:
  level:
    com.rohith.batch: INFO
    org.springframework.batch: WARN